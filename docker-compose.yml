# Запуск всей платформы одной командой:
#   docker compose up -d --build
# Сайт:     http://localhost:8080      Админка: http://localhost:8081
# Почта:    http://localhost:8025 (Mailpit — все письма, в т.ч. подтверждение email)
# Мониторинг (опционально): docker compose --profile monitoring up -d  → Grafana http://localhost:3030
# Значения ниже — только для локального запуска. Production-секреты в Git не хранятся (см. docs/DEPLOYMENT.md).
name: lotok

x-api-env: &api-env
  NODE_ENV: development
  DATABASE_URL: postgres://lotok:${POSTGRES_PASSWORD:-lotok}@postgres:5432/lotok
  REDIS_URL: redis://redis:6379/0
  API_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
  ADMIN_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8081}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080},${ADMIN_PUBLIC_URL:-http://localhost:8081}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-please-32+}
  APP_SIGNING_SECRET: ${APP_SIGNING_SECRET:-dev-only-signing-secret-change-me-please-32+}
  COOKIE_SECURE: "false"
  TRUST_PROXY: "1"
  # Объектное хранилище: SeaweedFS (S3-совместимое). Ключи совпадают с infra/seaweedfs/s3.json.
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: us-east-1
  S3_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}/media
  S3_BUCKET: lotok-media
  S3_PRIVATE_BUCKET: lotok-private
  S3_ACCESS_KEY: lotok
  S3_SECRET_KEY: lotok-s3-secret
  S3_FORCE_PATH_STYLE: "true"
  SEARCH_DRIVER: ${SEARCH_DRIVER:-opensearch}
  OPENSEARCH_URL: http://opensearch:9200
  QUEUE_MODE: bullmq
  MAIL_DRIVER: smtp
  SMTP_URL: smtp://mailpit:1025
  SMS_DRIVER: log
  PUSH_DRIVER: log
  PAYMENT_PROVIDER: mock
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-dev-only-mock-webhook-secret}
  AV_DRIVER: ${AV_DRIVER:-none}
  CLAMAV_HOST: clamav
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lotok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotok}
      POSTGRES_DB: lotok
    volumes: [pgdata:/var/lib/postgresql/data]
    # Порт наружу не публикуется, чтобы не конфликтовать с локальным PostgreSQL. Доступ: docker compose exec postgres psql -U lotok
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lotok -d lotok"], interval: 5s, timeout: 3s, retries: 30 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 30 }

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck: { test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"], interval: 10s, timeout: 5s, retries: 40 }

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"], interval: 5s, timeout: 3s, retries: 40 }

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]

  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]

  # Миграции + справочники (+ демо-данные при SEED_DEMO=1). Завершается до старта api/worker.
  migrate:
    image: lotok/api:local
    pull_policy: never
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/database/seed/seed.js"]
    healthcheck: { disable: true }
    environment:
      <<: *api-env
      SEED_DEMO: ${SEED_DEMO:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  api:
    image: lotok/api:local
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    image: lotok/api:local
    pull_policy: never
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment: *api-env
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: lotok/web:local
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: web, NEXT_PUBLIC_SITE_URL: "${PUBLIC_URL:-http://localhost:8080}", NEXT_PUBLIC_ADMIN_URL: "${ADMIN_PUBLIC_URL:-http://localhost:8081}" }
    restart: unless-stopped
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on:
      api: { condition: service_healthy }

  admin:
    image: lotok/admin:local
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: admin } }
    restart: unless-stopped
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080", "8081:8081"]
    depends_on: [web, admin, api, seaweedfs]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes: ["./infra/prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}" }
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3030:3000"]

  loki:
    image: grafana/loki:3.2.1
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes: ["./infra/loki/config.yml:/etc/loki/config.yml:ro"]

  promtail:
    image: grafana/promtail:3.2.1
    profiles: [monitoring]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes: { pgdata: {}, redisdata: {}, osdata: {}, s3data: {} }
