# Локальный запуск всей платформы: docker compose up -d --build
# Секреты для production здесь НЕ хранятся — см. .env.example и docs/DEPLOYMENT.md.
name: lotok

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: postgres://lotok:${POSTGRES_PASSWORD:-lotok}@postgres:5432/lotok
  REDIS_URL: redis://redis:6379/0
  API_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  WEB_URL: ${PUBLIC_URL:-http://localhost:8080}
  ADMIN_URL: ${ADMIN_PUBLIC_URL:-http://localhost:8081}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:8080},${ADMIN_PUBLIC_URL:-http://localhost:8081}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-access-secret-change-me-please-32+}
  APP_SIGNING_SECRET: ${APP_SIGNING_SECRET:-dev-only-signing-secret-change-me-please-32+}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}/media
  S3_BUCKET: lotok-media
  S3_PRIVATE_BUCKET: lotok-private
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-lotok}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lotok-minio-secret}
  S3_FORCE_PATH_STYLE: "true"
  SEARCH_DRIVER: ${SEARCH_DRIVER:-opensearch}
  OPENSEARCH_URL: http://opensearch:9200
  QUEUE_MODE: bullmq
  MAIL_DRIVER: smtp
  SMTP_URL: smtp://mailpit:1025
  SMS_DRIVER: ${SMS_DRIVER:-log}
  PUSH_DRIVER: ${PUSH_DRIVER:-log}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-dev-only-mock-webhook-secret}
  AV_DRIVER: ${AV_DRIVER:-none}
  CLAMAV_HOST: clamav
  LOG_LEVEL: info
  TRUST_PROXY: "1"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lotok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lotok}
      POSTGRES_DB: lotok
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lotok"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [osdata:/usr/share/opensearch/data]
    ports: ["9200:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"], interval: 10s, timeout: 5s, retries: 30 }

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lotok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lotok-minio-secret}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, timeout: 3s, retries: 20 }

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lotok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lotok-minio-secret}
    entrypoint: ["sh", "/init/minio-init.sh"]
    volumes: ["./infra/docker/minio-init.sh:/init/minio-init.sh:ro"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025"]

  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/database/seed/seed.js"]
    environment:
      <<: *api-env
      SEED_DEMO: ${SEED_DEMO:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      opensearch: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args: { APP: web, NEXT_PUBLIC_SITE_URL: "${PUBLIC_URL:-http://localhost:8080}", NEXT_PUBLIC_ADMIN_URL: "${ADMIN_PUBLIC_URL:-http://localhost:8081}" }
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on: [api]

  admin:
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: admin } }
    environment: { API_INTERNAL_URL: "http://api:4000" }
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080", "8081:8081"]
    depends_on: [web, admin, api]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes: ["./infra/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}" }
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3030:3000"]

  loki:
    image: grafana/loki:3.2.1
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/config.yml"]
    volumes: ["./infra/loki/config.yml:/etc/loki/config.yml:ro"]

  promtail:
    image: grafana/promtail:3.2.1
    profiles: [monitoring]
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./infra/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes: { pgdata: {}, redisdata: {}, osdata: {}, miniodata: {} }
