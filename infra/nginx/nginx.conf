worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  sendfile on;
  server_tokens off;
  client_max_body_size 20m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$request_uri","s":$status,"rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream api   { server api:4000;   keepalive 32; }
  upstream web   { server web:3000;   keepalive 16; }
  upstream admin { server admin:3000; keepalive 8; }
  upstream s3    { server seaweedfs:8333; }
  # Docker DNS: имена сервисов резолвятся при старте nginx.

  # Публичный сайт: web + API на одном origin (cookie первой стороны, без CORS).
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # В production HSTS добавляется на TLS-терминаторе (ingress / балансировщик).

    location /api/docs { deny all; }
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection "";
    }
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }
    location /media/ {
      proxy_pass http://s3/lotok-media/;
      proxy_hide_header Set-Cookie;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header X-Content-Type-Options nosniff always;
    }
    # Метрики и health — только из внутренней сети (Prometheus ходит напрямую в api:4000).
    location ~ ^/(metrics|health) { deny all; }
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }
  }

  # Административная панель — отдельный хост/порт; в production — доступ только из VPN/allowlist.
  server {
    listen 8081;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # allow 10.0.0.0/8; deny all;
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
    }
    location /media/ { proxy_pass http://s3/lotok-media/; }
    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location / { proxy_pass http://admin; proxy_set_header Host $host; }
  }
}
