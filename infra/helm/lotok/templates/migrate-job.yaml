# Миграции выполняются до обновления подов (pre-install/pre-upgrade hook). Advisory lock в migrate.js
# защищает от параллельного запуска.
apiVersion: batch/v1
kind: Job
metadata:
  name: lotok-migrate-{{ .Release.Revision }}
  labels: {{- include "lotok.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      {{- include "lotok.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "lotok.image" (dict "root" . "name" "api") }}
          {{- if and .Release.IsInstall .Values.seed.onInstall }}
          # Первая установка: миграции + справочники (категории, регионы, тарифы, стоп-слова) и служебные учётные записи.
          # Seed идемпотентен, но при обновлениях не запускается, чтобы не возвращать удалённые в админке категории.
          command: ["sh", "-c", "node dist/database/migrate.js && node dist/database/seed/seed.js"]
          {{- else }}
          command: ["node", "dist/database/migrate.js"]
          {{- end }}
          {{- include "lotok.apiEnv" . | nindent 10 }}
