server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  # Логи контейнеров compose-проекта «lotok» (JSON от pino и nginx).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters: [{ name: label, values: ['com.docker.compose.project=lotok'] }]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      - json: { expressions: { level: level, requestId: req.id } }
      - labels: { level: '' }
