# CI/CD «Лоток»: проверки → тесты (unit, integration, E2E) → сборка образов → миграции и деплой (Helm).
# Секреты (KUBE_CONFIG, реестр, значения Helm) задаются в CI/CD Variables GitLab (masked + protected), не в репозитории.

stages: [lint, test, e2e, build, deploy]

variables:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  POSTGRES_USER: lotok
  POSTGRES_PASSWORD: lotok
  POSTGRES_DB: lotok_test
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_API: $CI_REGISTRY_IMAGE/api
  IMAGE_WEB: $CI_REGISTRY_IMAGE/web
  IMAGE_ADMIN: $CI_REGISTRY_IMAGE/admin

.node:
  image: node:22-bookworm
  before_script:
    - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm --filter @lotok/shared build
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

typecheck:
  extends: .node
  stage: lint
  script:
    - pnpm --filter @lotok/api typecheck
    - pnpm --filter @lotok/web typecheck
    - pnpm --filter @lotok/admin typecheck
    - pnpm --filter @lotok/mobile typecheck

unit:
  extends: .node
  stage: test
  script:
    - pnpm --filter @lotok/shared test
    - cd apps/api && npx jest --selectProjects unit
    - cd ../mobile && npx jest

integration:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    TEST_DATABASE_URL: postgres://lotok:lotok@postgres:5432/lotok_test
    TEST_REDIS_URL: redis://redis:6379/15
  script:
    - cd apps/api && npx jest --selectProjects integration --ci

integration-opensearch:
  extends: .node
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
    - name: opensearchproject/opensearch:2.17.1
      alias: opensearch
      variables: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
  variables:
    TEST_DATABASE_URL: postgres://lotok:lotok@postgres:5432/lotok_test
    TEST_REDIS_URL: redis://redis:6379/15
    TEST_SEARCH_DRIVER: opensearch
    OPENSEARCH_URL: http://opensearch:9200
  script:
    - cd apps/api && npx jest --selectProjects integration --ci test/search-chat.e2e.ts
  allow_failure: true

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    E2E_DATABASE_URL: postgres://lotok:lotok@postgres:5432/lotok_e2e
    E2E_REDIS_URL: redis://redis:6379/14
  before_script:
    - corepack enable && corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile
    - pnpm --filter @lotok/shared build
    - pnpm --filter @lotok/api build && NEXT_PUBLIC_WS_URL=http://localhost:4000 pnpm --filter @lotok/web build && pnpm --filter @lotok/admin build
  script:
    - cd e2e && npx playwright test --trace off
  artifacts:
    when: on_failure
    paths: [e2e/playwright-report, e2e/test-results]
    expire_in: 7 days

mobile-bundle:
  extends: .node
  stage: build
  script:
    - cd apps/mobile && npx expo export --platform android --platform ios --output-dir dist
  artifacts: { paths: [apps/mobile/dist], expire_in: 7 days }

.docker:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG

build-api:
  extends: .docker
  script:
    - docker build -f infra/docker/api.Dockerfile -t $IMAGE_API:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_API:$CI_COMMIT_SHORT_SHA

build-web:
  extends: .docker
  script:
    - docker build -f infra/docker/next.Dockerfile --build-arg APP=web --build-arg NEXT_PUBLIC_SITE_URL=$SITE_URL --build-arg NEXT_PUBLIC_ADMIN_URL=$ADMIN_SITE_URL -t $IMAGE_WEB:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_WEB:$CI_COMMIT_SHORT_SHA

build-admin:
  extends: .docker
  script:
    - docker build -f infra/docker/next.Dockerfile --build-arg APP=admin -t $IMAGE_ADMIN:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE_ADMIN:$CI_COMMIT_SHORT_SHA

.deploy:
  stage: deploy
  image: alpine/helm:3.16.3
  script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig && export KUBECONFIG=/tmp/kubeconfig
    # Миграции выполняются pre-upgrade hook'ом (Job) до выката новых подов.
    - >
      helm upgrade --install lotok infra/helm/lotok
      --namespace $KUBE_NAMESPACE --create-namespace
      -f $HELM_VALUES_FILE
      --set image.tag=$CI_COMMIT_SHORT_SHA
      --set image.registry=$CI_REGISTRY_IMAGE
      --wait --timeout 10m --atomic

deploy-staging:
  extends: .deploy
  environment: { name: staging }
  variables: { KUBE_NAMESPACE: lotok-staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-production:
  extends: .deploy
  environment: { name: production }
  variables: { KUBE_NAMESPACE: lotok }
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
